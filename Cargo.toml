[package]
name = "float-clock"
version = "0.4.1"
edition = "2021"
rust-version = "1.80"
description = "Borderless, transparent, always-on-top T+/- countdown overlay for the desktop"
license = "MIT"
repository = "https://github.com/bananaxiao2333/float-clock"
keywords = ["countdown", "overlay", "transparent", "egui", "desktop"]
categories = ["gui", "command-line-utilities"]
build = "build.rs"

[dependencies]
eframe = { version = "0.36", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
ab_glyph = "0.2"
fontdb = "0.24"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
png = "0.18"
# Diagnostics only: read the real pixels back out of the GPU (--probe)
egui_glow = "0.36"
glow = "0.17"

# Tray / menu-bar icon. macOS (NSStatusItem) and Windows (Shell_NotifyIcon) only.
# Default features are deliberately off: `gtk` would pull in libappindicator and a
# GTK3 runtime dependency, which costs us the dependency-free static Linux binary,
# and `libxdo` is not needed either.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tray-icon = { version = "0.25", default-features = false }

# Windows: the UIAccess bootstrap needs raw Win32 - token duplication,
# SetTokenInformation(TokenUIAccess) and CreateProcessAsUserW.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_RemoteDesktop",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# macOS only: pixel health check of the real NSWindow (--probe).
# Not compiled at all on any other platform.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = { version = "0.3", features = [
    "NSApplication",
    "NSBitmapImageRep",
    "NSColor",
    "NSImageRep",
    "NSView",
    "NSWindow",
] }

# Windows: embeds the icon and the version block into the .exe.
# This has to be a plain build-dependency: cargo matches the `[target.'cfg(...)'.build-dependencies]`
# table against the *host*, so cross-compiling for Windows from macOS would silently drop it
# (cfg(windows) is false for the host). The real decision is made in build.rs from the TARGET env var.
[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 1
