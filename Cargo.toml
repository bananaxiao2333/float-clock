[package]
name = "float-clock"
version = "0.2.1"
edition = "2021"
rust-version = "1.80"
description = "无背景悬浮 T± 倒计时 / borderless floating countdown overlay"
license = "MIT"
repository = "https://github.com/bananaxiao2333/float-clock"
keywords = ["countdown", "overlay", "transparent", "egui", "desktop"]
categories = ["gui", "command-line-utilities"]
build = "build.rs"

[dependencies]
eframe = { version = "0.36", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
ab_glyph = "0.2"
fontdb = "0.24"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
png = "0.18"
# 排障用：从 GPU 回读真实渲染结果（--probe）
egui_glow = "0.36"
glow = "0.17"

# 只有 macOS 上用来给窗口做像素体检（--probe），其它平台完全不参与编译
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = { version = "0.3", features = [
    "NSApplication",
    "NSBitmapImageRep",
    "NSColor",
    "NSImageRep",
    "NSView",
    "NSWindow",
] }

# Windows：把图标和版本信息写进 exe。
# 只能放成普通 build-dependencies —— cargo 的 target 表对 build-dependencies
# 是按**宿主**匹配的，从 macOS 交叉编译 windows 时 cfg(windows) 不成立，
# 依赖会被整个跳过。真正的取舍在 build.rs 里用 TARGET 环境变量判断。
[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 1
