name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # The render layer needs system fonts: the tests look up glyphs one by one.
      # No CJK font is installed any more, because nothing in this repository is
      # written in Chinese.
      - name: Install fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fonts-dejavu-core

      - name: Formatting
        run: cargo fmt --all -- --check

      # A step name with an unquoted ": " in it is not valid YAML, and GitHub
      # only reports that when the workflow is evaluated - which for release.yml
      # means "when someone pushes a tag", i.e. too late to be useful. Catch it
      # on every push instead. (This has bitten us once already.)
      #
      # Ruby ships on the runner image and brings a YAML parser with it, so this
      # needs no network and no extra action.
      - name: Workflow YAML
        run: |
          for file in .github/workflows/*.yml; do
            ruby -ryaml -e \
              'YAML.safe_load(File.read(ARGV[0]), aliases: true); puts "#{ARGV[0]} OK"' \
              "$file"
          done

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test --all-targets

      - name: Build (host platform)
        run: cargo build --release
