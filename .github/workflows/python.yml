name: Python CI

on:
  push:
    branches: [python]
  pull_request:
    branches: [python]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev

      # Only the pure-logic unit tests run here: the Tk smoke tests (test_overlay_smoke.py)
      # need a real display, so run `uv run python -m unittest discover -s tests -v`
      # separately on such a machine.
      - name: Unit tests
        run: uv run python -m unittest discover -s tests -p "test_float_clock.py" -v

      - name: "Smoke test: the command line starts up"
        run: |
          uv run float-clock --version
          uv run float-clock --init-config --config ./smoke.toml
          uv run float-clock --config ./smoke.toml \
            --target "2026-09-19T20:29:00" --offset "+120m" --print
