name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish or overwrite, e.g. v0.3.0 (leave empty to only build)"
        required: false
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BIN: float-clock

jobs:
  # -- macOS: build arm64 and x86_64 separately, then lipo them into one binary --
  macos:
    name: macOS (universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-universal

      - name: Build arm64
        run: cargo build --release --target aarch64-apple-darwin

      - name: Build x86_64
        run: cargo build --release --target x86_64-apple-darwin

      - name: Combine into a universal binary
        run: |
          mkdir -p out
          lipo -create \
            "target/aarch64-apple-darwin/release/$BIN" \
            "target/x86_64-apple-darwin/release/$BIN" \
            -output "out/$BIN"
          lipo -info "out/$BIN"
          file "out/$BIN"

      # A browser download strips the executable bit, and Finder then treats a
      # bare Mach-O binary as text and hands it to TextEdit, which greets the
      # user with "the text encoding Unicode (UTF-8) is not applicable". The
      # .app inside a zip is what people should actually download: the zip
      # preserves the mode and the icon.
      - name: Bundle into a .app and zip it
        run: |
          VERSION="$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)"
          mkdir -p stage
          mv "out/$BIN" "stage/$BIN"
          tools/make_app.sh "stage/$BIN" "$VERSION" stage
          rm -f "stage/$BIN"
          cp QUICKSTART.txt config.example.toml stage/
          (cd stage && zip -qry "../out/$BIN-macos-universal.zip" .)
          unzip -l "out/$BIN-macos-universal.zip"

      - name: Smoke test (the commands that do not open a window)
        run: |
          APP="stage/FloatClock.app/Contents/MacOS/$BIN"
          "$APP" --version
          "$APP" --init-config --config ./smoke.toml
          "$APP" --config ./smoke.toml \
            --target "2026-09-19T20:29:00" --offset "+120m" \
            --now "2026-09-19T20:00:00" --print
          "$APP" --config ./smoke.toml \
            --target "2026-09-19T20:29:00" --offset "+120m" \
            --now "2026-09-19T20:00:00" --render-png ./smoke.png --scale 2
          file ./smoke.png
          # The binary inside the .app has to keep its executable bit through
          # the round trip, otherwise the archive is pointless.
          rm -rf ./unpacked && mkdir ./unpacked
          unzip -q "out/$BIN-macos-universal.zip" -d ./unpacked
          test -x "./unpacked/FloatClock.app/Contents/MacOS/$BIN"
          codesign -dv ./unpacked/FloatClock.app 2>&1 | head -3 || true

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: out/float-clock-macos-universal.zip
          if-no-files-found: error

  # -- Linux: use zig as the linker and pin the glibc floor at 2.28 ------------
  # That covers Ubuntu 20.04 / Debian 10 and newer without needing a container.
  linux:
    name: Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-zig

      # Not pinned: the combination verified locally is "latest zig + latest
      # cargo-zigbuild".
      - uses: mlugg/setup-zig@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Build (glibc 2.28 floor)
        run: cargo zigbuild --release --target x86_64-unknown-linux-gnu.2.28

      - name: Package
        run: |
          mkdir -p stage
          install -m 0755 "target/x86_64-unknown-linux-gnu/release/$BIN" "stage/$BIN"
          file "stage/$BIN"
          cp QUICKSTART.txt config.example.toml stage/
          mkdir -p out
          (cd stage && zip -qry "../out/$BIN-linux-x86_64.zip" .)
          unzip -l "out/$BIN-linux-x86_64.zip"

      - name: Smoke test (the commands that do not open a window)
        run: |
          BIN_PATH="stage/$BIN"
          "$BIN_PATH" --version
          "$BIN_PATH" --init-config --config ./smoke.toml
          "$BIN_PATH" --config ./smoke.toml \
            --target "2026-09-19T20:29:00" --offset "+120m" \
            --now "2026-09-19T20:00:00" --print
          "$BIN_PATH" --config ./smoke.toml \
            --target "2026-09-19T20:29:00" --offset "+120m" \
            --now "2026-09-19T20:00:00" --render-png ./smoke.png --scale 2
          file ./smoke.png
          "$BIN_PATH" --diagnose
          # The zip has to hand back an executable binary.
          rm -rf ./unpacked && mkdir ./unpacked
          unzip -q "out/$BIN-linux-x86_64.zip" -d ./unpacked
          test -x "./unpacked/$BIN"
          "./unpacked/$BIN" --version

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: out/float-clock-linux-x86_64.zip
          if-no-files-found: error

  # -- Windows -----------------------------------------------------------------
  # The MSVC toolchain ships with the windows runner, so this needs no setup.
  # (Local cross-compiles from macOS / Linux go through mingw-w64 in build.sh;
  # the resulting binaries are equivalent.)
  windows:
    name: Windows x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-msvc

      - name: Build
        run: cargo build --release --target x86_64-pc-windows-msvc

      # The icon and version block are written into the exe by build.rs through
      # winresource (MSVC uses the system rc.exe).
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path stage, out | Out-Null
          Copy-Item "target/x86_64-pc-windows-msvc/release/$env:BIN.exe" "stage/$env:BIN.exe"
          Copy-Item QUICKSTART.txt, config.example.toml stage/
          Compress-Archive -Path "stage/*" -DestinationPath "out/$env:BIN-windows-x86_64.zip" -Force
          Get-ChildItem out | Format-Table Name, Length

      - name: Smoke test (the commands that do not open a window)
        shell: pwsh
        run: |
          $bin = "stage/$env:BIN.exe"
          & $bin --version
          if ($LASTEXITCODE -ne 0) { throw "--version failed" }
          & $bin --init-config --config ./smoke.toml
          & $bin --config ./smoke.toml `
              --target "2026-09-19T20:29:00" --offset "+120m" `
              --now "2026-09-19T20:00:00" --print
          if ($LASTEXITCODE -ne 0) { throw "--print failed" }
          & $bin --config ./smoke.toml `
              --target "2026-09-19T20:29:00" --offset "+120m" `
              --now "2026-09-19T20:00:00" --render-png ./smoke.png --scale 2
          if ($LASTEXITCODE -ne 0) { throw "--render-png failed" }
          Get-Item ./smoke.png | Format-List Name, Length

          # Is the resource section there (icon plus version block)?
          $info = (Get-Item $bin).VersionInfo
          "ProductName    : $($info.ProductName)"
          "FileDescription: $($info.FileDescription)"
          "FileVersion    : $($info.FileVersion)"
          if ($info.ProductName -ne "FloatClock") { throw "no version info in the exe" }

          # The zip has to contain the exe.
          Expand-Archive -Path "out/$env:BIN-windows-x86_64.zip" -DestinationPath ./unpacked -Force
          if (-not (Test-Path "./unpacked/$env:BIN.exe")) { throw "the exe is missing from the zip" }
          & "./unpacked/$env:BIN.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "the exe from the zip does not run" }

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/float-clock-windows-x86_64.zip
          if-no-files-found: error

  # -- Collect everything into one Release -------------------------------------
  release:
    name: Publish
    needs: [macos, linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: |
          ls -lh
          rm -f SHA256SUMS
          # Only the published archives: every platform ships one .zip.
          sha256sum ./*.zip | sed 's|\./||' | sort -k 2 > SHA256SUMS
          cat SHA256SUMS

      - name: Tag (when triggered by hand)
        if: github.event_name == 'workflow_dispatch' && inputs.tag != ''
        run: |
          git tag -f "${{ inputs.tag }}"
          git push -f origin "${{ inputs.tag }}"

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: FloatClock ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          draft: false
          files: |
            dist/float-clock-macos-universal.zip
            dist/float-clock-linux-x86_64.zip
            dist/float-clock-windows-x86_64.zip
            dist/SHA256SUMS

      - name: Build-only run: keep the artefacts in Actions
        if: github.event_name == 'workflow_dispatch' && inputs.tag == ''
        uses: actions/upload-artifact@v4
        with:
          name: all-platforms
          path: dist/*
