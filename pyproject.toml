[project]
name = "float-clock"
version = "1.0.0"
description = "Borderless, transparent, always-on-top T± countdown overlay: bold green monospace text, draggable, right-click to lock, system notifications near each moment"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["clock", "countdown", "timer", "overlay", "tkinter", "desktop"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: MacOS X :: Aqua",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Desktop Environment",
    "Topic :: Office/Business :: Scheduling",
]
dependencies = [
    "pillow>=12.3.0",
]

[project.scripts]
float-clock = "float_clock.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/float_clock"]

# The interpreter is pinned to 3.12.7 by .python-version:
#   1) it has to be a uv-managed interpreter (the Homebrew python ships no _tkinter)
#   2) it has to be a build that bundles Tk 8.6 -- on macOS Tk 9.0 paints
#      systemTransparent as opaque black, turning the overlay into a black box
#      with smeared text
[tool.uv]
python-preference = "only-managed"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
]
