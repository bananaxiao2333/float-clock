[project]
name = "float-clock"
version = "1.0.0"
description = "无背景悬浮 T± 倒计时浮窗：绿色粗体等宽字体、可拖动、右键锁定、临近时间点系统通知"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pillow>=12.3.0",
]

[project.scripts]
float-clock = "float_clock.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/float_clock"]

# 解释器由 .python-version 钉在 3.12.7：
#   1) 必须是 uv 托管的解释器（Homebrew 的 python 不带 _tkinter）
#   2) 必须是自带 Tk 8.6 的构建 —— Tk 9.0 在 macOS 上会把 systemTransparent
#      画成不透明黑，浮窗会变成黑底 + 文字拖影
[tool.uv]
python-preference = "only-managed"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
]
